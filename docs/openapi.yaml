# Shelf backend HTTP API.
#
# Every response body and status code below was captured from the deployed project,
# not written from the source. `npm run verify:functions` re-checks the live endpoints
# against this contract in one command.
#
# Every endpoint below is deployed. /share-resolve and /share-confirm went live on
# 8 September 2026 and are checked by `npm run verify:share` (55 checks);
# /games/popular-with-friends on 9 September, checked by
# `npm run verify:friends-popular` (31); the four /steam-* endpoints on 14 September,
# checked by `npm run verify:linking` (61, including a real 4,652-game import through
# the deployed function); the rest by `npm run verify:functions` and
# `npm run verify:roulette`. Nothing here is aspirational.

openapi: 3.1.0

info:
  title: Shelf backend API
  version: "2026-09-14.1"
  description: |
    Games catalog, share ingestion and roulette for the Shelf app.

    Supabase Edge Functions over a Postgres catalog of 89,117 games seeded from IGDB.

    **Authentication is required on every endpoint but one.** There is no public
    read. The single exception is `/steam-link-callback`, which Steam's servers
    redirect the user's browser to and which therefore cannot carry a JWT; it trusts
    nothing in the request and verifies the sign-in with Steam directly. The app
    never calls it.
    The caller sends a Supabase user access token; the function rebuilds a Supabase
    client from that exact token, so row-level security applies to everything it
    touches. No endpoint ever uses the service role key to read user data.

    **Two different error shapes.** Requests that fail the platform's JWT check are
    rejected by the Supabase edge gateway before the function runs, and it answers
    `{"code","message"}`. Errors the function itself raises answer `{"error"}`.
    Handle both — see the `Error` schemas.

    **IGDB attribution is contractually required** wherever this data is shown to a
    user: a visible, static credit to IGDB.com. `criticScore` is IGDB's own
    aggregate of external critic scores; it is not Metacritic and must not be
    labelled as such.

    **Connecting a platform is not a way to sign in.** Steam, Xbox and PlayStation
    are connections made *inside* an already-signed-in Prysm account, never
    authentication methods. That is what keeps App Store guideline 4.8 — and with it
    mandatory Sign in with Apple — out of scope for the whole app.

    **This file does not cover the whole backend.** The friends feed, the
    notification inbox, the library and the wishlist are PostgREST tables and RPCs
    under row-level security, not HTTP endpoints — there is no edge function to
    describe, so they are absent here by design rather than by omission. They are documented
    in the published API reference, and their migrations are the source of truth.
    Only `/games/popular-with-friends` crosses over: it wraps an RPC in an endpoint
    so the response carries the derived `abbreviation` and `colorKey` fields, which
    a direct RPC call cannot.

    Disconnecting a platform is in that PostgREST-and-RPC category too:
    `rpc('shelf_disconnect_platform', { p_platform: 'steam' })`. It deletes the
    connection and every imported row the user never touched, keeps anything they
    re-statused, rated or annotated, and returns how many rows it removed.

servers:
  - url: https://sbunhrxwhraigwpidbxk.supabase.co/functions/v1
    description: Production (the only environment; there is no staging project)

tags:
  - name: catalog
    description: Live and verified against real data.
  - name: library
    description: >
      Live and verified. Reads the caller's own `library_entries` rather than the
      catalog, so what it returns depends on what that user has saved.
  - name: share
    description: >
      Live and verified 8 September 2026. Turns a shared TikTok or YouTube link
      into a library row. `/share-confirm` is the only path that writes
      `library_entries`.
  - name: social
    description: >
      Live and verified 9 September 2026. Reads across the follow graph rather than
      the caller's own rows, so what it returns depends on who they follow and on
      what those people have opted to publish.

security:
  - userToken: []

paths:
  /search:
    get:
      tags: [catalog]
      operationId: searchGames
      summary: Search the games catalog
      description: |
        Ranked full-text search over titles and alternative titles, so `botw`,
        `gta v` and `bg3` resolve to the right game.

        Reads the local catalog first. If the best local match scores below 0.55
        the function makes one live IGDB lookup, ingests anything new and searches
        again; a failure in that path is logged and swallowed, and the local
        results are served anyway. So this endpoint does not return 502 when IGDB
        is down — it returns the catalog's best effort.

        Ranking and filtering are different things here. Without
        `releaseFrom`/`releaseTo`, `genre` or `device` the endpoint ranks and
        never excludes: a close-but-wrong title can outrank the one the user
        meant on short queries, which is why the share flow makes the user
        confirm. Those four parameters do exclude, and they are applied inside
        the query, before the 10-row limit — filtering the response instead would
        leave a near-empty page.

        The live IGDB lookup runs only for an unfiltered `best_match` query. Under
        a filter a thin result usually means the filter is working, and `score` is
        no longer the ordering key once a sort is chosen, so the 0.55 threshold
        would be reading a number that no longer means what it means here.

        Never returns 404. No match is `200 []`.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: >
            The query. Trimmed. Fewer than 2 characters (including missing or
            empty) short-circuits to `200 []` without touching the database.
          examples:
            title:   { value: elden ring }
            abbrev:  { value: botw }
            tooShort: { value: e, summary: "Returns [] — under the 2-character floor" }
        - name: releaseFrom
          in: query
          required: false
          schema: { type: string, format: date }
          description: >
            Inclusive lower bound on release date, `YYYY-MM-DD`. Omit for
            unbounded. Two dates rather than named eras (`2020s`) on purpose: the
            app owns the bucket labels and their boundaries, so moving a boundary
            is an app release, not a migration.

            Undated games match no date filter, including "Upcoming". Settled
            14 Sep: "Upcoming" means dated future releases (3,668 of them), not
            announced-but-undated games — IGDB's undated titles are excluded from
            both seed passes on purpose and only 2 such rows exist in 89,123.
          examples:
            decade:   { value: "2020-01-01", summary: "Paul's 2020s bucket, with releaseTo=2029-12-31" }
            upcoming: { value: "2026-09-15", summary: "Upcoming — tomorrow onwards, releaseTo omitted" }
        - name: releaseTo
          in: query
          required: false
          schema: { type: string, format: date }
          description: >
            Inclusive upper bound on release date, `YYYY-MM-DD`. Omit for
            unbounded. `releaseFrom` after `releaseTo` is a 400.
        - name: genre
          in: query
          required: false
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
          description: >
            Genre pill slugs. Repeat the parameter or comma-separate:
            `?genre=rpg&genre=puzzle` and `?genre=rpg,puzzle` are the same query.
            Multiple pills are an OR. Backend-owned vocabulary, because the
            rollups are a fact about IGDB's data rather than a UI choice — the app
            cannot know that `strategy` has to absorb `Turn-based strategy (TBS)`,
            `Real Time Strategy (RTS)`, `Tactical` and `MOBA`.

            Served: `adventure`, `rpg`, `fps`, `strategy`, `simulation`, `sports`,
            `racing`, `fighting`, `platformer`, `puzzle`.

            NOT SERVED, and they return `200 []` rather than an error: `action`,
            `souls`, `open-world`, `survival`. IGDB has no "Action" genre, and the
            other three are themes and keywords — columns that exist but hold
            nothing for any of the 89,123 catalog rows. Decided 14 Sep not to
            re-seed for them: a pill the provider has no data for is not invented
            here, and the app reconciles its pill row instead.

            The vocabulary is queryable rather than hardcoded — the `genre_pills`
            table is selectable by any authenticated session, so
            `select distinct pill` is the live list of slugs that filter
            something. Build the pill row from that and an unservable pill cannot
            ship.
          examples:
            one:  { value: [rpg] }
            many: { value: [rpg, puzzle] }
        - name: device
          in: query
          required: false
          schema:
            type: array
            items: { type: string, enum: [playstation, xbox, nintendo, pc, mobile] }
          style: form
          explode: true
          description: >
            Device Type pill. Repeat or comma-separate; multiple values are an OR.
            An unrecognised value is a 400 — there are only five, so a typo means
            the app is wrong.

            4,094 catalog rows reach none of the five (retro, arcade, VR, browser,
            Stadia) and are invisible to this filter by design.
          examples:
            one:  { value: [xbox] }
            many: { value: [xbox, pc] }
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [best_match, popular, rating, recent, alpha]
            default: best_match
          description: >
            `best_match` (default) is the existing ranking and is unchanged.
            `popular` is rating count and takes no direction. `rating` is critic
            score — thin, see the caveat below. `recent` is release date and
            excludes unreleased games unless a release window is set explicitly.
            `alpha` is title.

            CAVEAT ON `rating`: `criticScore` is present on 8,952 of 89,123 rows
            (10.0%). Sorted by it, nine rows in ten fall to the bottom on absence
            rather than on merit, ordered only by rating count. It is honest for
            the games that have a score and close to arbitrary for the rest.
          examples:
            recent: { value: recent }
        - name: sortDir
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: desc }
          description: >
            Applies to `rating`, `recent` and `alpha`. Ignored for `best_match`
            and `popular` — per the design, Most Popular takes no order.
      responses:
        "200":
          description: >
            Up to 10 matches, in the requested `sort` order (best first by
            default). An empty array is a normal, successful answer, not an
            error — and under a filter it is often the correct one.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items: { $ref: "#/components/schemas/CatalogGame" }
              examples:
                eldenRing:
                  summary: q=elden ring (first 2 of 10, captured 8 Sep 2026)
                  value:
                    - id: fc9cd9c2-aa68-42c0-9226-33cf6c4bcdef
                      title: Elden Ring
                      slug: elden-ring
                      platforms:
                        - { id: 508, name: Nintendo Switch 2, slug: switch-2 }
                        - { id: 6, name: PC (Microsoft Windows), slug: win }
                        - { id: 48, name: PlayStation 4, slug: ps4--1 }
                        - { id: 167, name: PlayStation 5, slug: ps5 }
                        - { id: 49, name: Xbox One, slug: xboxone }
                        - { id: 169, name: Xbox Series X|S, slug: series-x-s }
                      releaseDate: "2022-02-25"
                      genres: [Role-playing (RPG), Adventure]
                      coverImageUrl: https://images.igdb.com/igdb/image/upload/t_cover_big_2x/co4jni.jpg
                      timeToBeatHours: 119.4
                      sessionFit: low
                      criticScore: 97
                      abbreviation: ER
                      colorKey: red
                    - id: c0fe5da2-0b39-4587-9dfa-5320c5b46a3a
                      title: Elder Ring
                      slug: elder-ring
                      platforms:
                        - { id: 6, name: PC (Microsoft Windows), slug: win }
                      releaseDate: "2025-05-22"
                      genres: [Role-playing (RPG), Adventure, Indie]
                      coverImageUrl: https://images.igdb.com/igdb/image/upload/t_cover_big_2x/coa9qd.jpg
                      sessionFit: low
                      abbreviation: ER
                      colorKey: teal
                empty:
                  summary: q under 2 characters, or nothing matched
                  value: []
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }
    options:
      tags: [catalog]
      operationId: searchPreflight
      summary: CORS preflight
      security: []
      responses:
        "200":
          description: 'Body is the literal string `ok`. Allows any origin.'
          content:
            text/plain:
              schema: { type: string, const: ok }

  /games/popular:
    get:
      tags: [catalog]
      operationId: listPopularGames
      summary: The most-rated games in the catalog
      description: |
        Ordered by IGDB's count of **user ratings**, descending — a popularity
        signal, not a quality one. Do not confuse it with `criticScore`, which is
        IGDB's aggregate of external critic scores: a game can be widely played and
        mediocre, or acclaimed and obscure.

        That count is deliberately **not** part of `CatalogGame`. The ordering is
        the contract; the number behind it is not, so it can be re-tuned without
        breaking the app.

        The list contains only games with at least one rating, so it is finite at
        **15,948 entries** (of 89,117 catalog rows). Paging past the end returns
        `[]` rather than an error. Ties are broken by a stable internal id, so
        `limit`/`offset` paging never drops or repeats a row.

        Served by the same `games` function as `/games/{id}`; `popular` is not a
        valid uuid, so the two cannot collide.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: >
            Page size. Values above 100 are clamped to 100; a non-integer or
            unparseable value falls back to 20 rather than erroring.
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
          description: >
            Rows to skip. Negative and unparseable values fall back to 0.
      responses:
        "200":
          description: >
            A page of games, most-rated first. Captured from the deployed function
            with `?limit=2` on 8 September 2026.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogGame" }
              example:
                - id: b84425b1-2d74-42f7-9975-ceb7f8e9cc0e
                  title: Grand Theft Auto V
                  slug: grand-theft-auto-v
                  platforms:
                    - { id: 6, name: PC (Microsoft Windows), slug: win }
                    - { id: 9, name: PlayStation 3, slug: ps3 }
                    - { id: 48, name: PlayStation 4, slug: ps4--1 }
                    - { id: 167, name: PlayStation 5, slug: ps5 }
                    - { id: 12, name: Xbox 360, slug: xbox360 }
                    - { id: 49, name: Xbox One, slug: xboxone }
                    - { id: 169, name: Xbox Series X|S, slug: series-x-s }
                  releaseDate: "2013-09-17"
                  genres: [Shooter, Racing, Adventure]
                  coverImageUrl: https://images.igdb.com/igdb/image/upload/t_cover_big_2x/co2lbd.jpg
                  timeToBeatHours: 127.5
                  sessionFit: high
                  criticScore: 88
                  abbreviation: GTA
                  colorKey: purple
                - id: 69b228a0-0452-4b69-a0a9-c9a0237da5d3
                  title: "The Witcher 3: Wild Hunt"
                  slug: the-witcher-3-wild-hunt
                  platforms:
                    - { id: 130, name: Nintendo Switch, slug: switch }
                    - { id: 6, name: PC (Microsoft Windows), slug: win }
                    - { id: 48, name: PlayStation 4, slug: ps4--1 }
                    - { id: 167, name: PlayStation 5, slug: ps5 }
                    - { id: 49, name: Xbox One, slug: xboxone }
                    - { id: 169, name: Xbox Series X|S, slug: series-x-s }
                  releaseDate: "2015-05-19"
                  genres: [Role-playing (RPG), Adventure]
                  coverImageUrl: https://images.igdb.com/igdb/image/upload/t_cover_big_2x/coaarl.jpg
                  timeToBeatHours: 70.8
                  sessionFit: low
                  criticScore: 92
                  abbreviation: W3W
                  colorKey: green
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /games/popular-with-friends:
    get:
      tags: [social]
      operationId: listPopularWithFriends
      summary: What the people you follow are playing
      description: |
        Ranked by how many of the people the caller follows have the game on their
        shelf. Deployed and verified 9 September 2026;
        `npm run verify:friends-popular` re-checks it (31 checks).

        **Counted:** `playing` and `beaten`. **Excluded:** `backlog` (an intention,
        not a game they play) and `dropped` (a negative signal, and actively
        misleading under a "popular" heading).

        **A game appears only once at least 3 distinct followees have it.** That
        floor is not a parameter and cannot be lowered by a caller — see below.

        **Privacy.** `library_entries` is owner-only and stayed that way: no policy
        on it changed, and a follower reading another account's rows still gets
        zero. What this returns is a derived aggregate over people who opted in
        with `profiles.share_activity` (default `true`), and it never attributes a
        game to a named person — only a count.

        The underlying function is `SECURITY DEFINER` and lives in `public`, which
        is normally the shape that leaks. It is safe here because **it takes no
        user id**: the viewer is `auth.uid()`, read inside, so there is no target
        to point it at. Preserve that if it is ever edited.

        Served by the same `games` function as `/games/{id}` and `/games/popular`.

        **Why this is an endpoint and not a documented RPC call:** `abbreviation`
        and `colorKey` are not columns — they are derived server-side. Calling the
        function directly over PostgREST returns neither, and the app resolves a
        missing `colorKey` to grey with no error on either side.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: >
            Page size. Values above 100 are clamped; an unparseable value falls
            back to 20 rather than erroring.
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
          description: >
            Rows to skip. Negative and unparseable values fall back to 0. Paging
            past the end returns `[]`.
      responses:
        "200":
          description: >
            Games the caller's followees are playing, most-shared first. **An empty
            array is the normal answer** for a new account, for anyone following
            fewer than 3 people, and for anyone whose followees have not synced a
            library — it is never an error. Captured from the deployed function
            with `?limit=2` on 9 September 2026, against four seeded accounts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CatalogGameWithFriendCount" }
              example:
                - id: 07d5a6f3-44c7-4784-a8aa-93025ac5a72b
                  title: Hollow Knight
                  slug: hollow-knight
                  platforms:
                    - { id: 3, name: Linux, slug: linux }
                    - { id: 130, name: Nintendo Switch, slug: switch }
                    - { id: 6, name: PC (Microsoft Windows), slug: win }
                  releaseDate: "2017-02-24"
                  genres: [Platform, Adventure, Indie]
                  coverImageUrl: https://images.igdb.com/igdb/image/upload/t_cover_big_2x/cobfzp.jpg
                  timeToBeatHours: 36.4
                  sessionFit: low
                  criticScore: 91
                  abbreviation: HK
                  colorKey: blue
                  friendCount: 3
                - id: 7725f739-6cb0-4f2e-ab46-cdfc72753213
                  title: Hades
                  slug: hades--1
                  platforms:
                    - { id: 130, name: Nintendo Switch, slug: switch }
                    - { id: 6, name: PC (Microsoft Windows), slug: win }
                  releaseDate: "2020-09-17"
                  genres: [Role-playing (RPG), Adventure, Indie]
                  coverImageUrl: https://images.igdb.com/igdb/image/upload/t_cover_big_2x/cob9kr.jpg
                  timeToBeatHours: 70.3
                  sessionFit: high
                  criticScore: 94
                  abbreviation: H
                  colorKey: gold
                  friendCount: 2
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /games/{id}:
    get:
      tags: [catalog]
      operationId: getGame
      summary: Fetch one game by id
      description: |
        The function is deployed under the slug `games`, so the real path is
        `/functions/v1/games/<uuid>` — the id is the last path segment, not a
        query parameter.

        Only a uuid is accepted. `slug` is returned on every game and is safe to
        put in a share link, but this endpoint will not look a game up by it.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The game's uuid, as returned in `CatalogGame.id`.
          example: fc9cd9c2-aa68-42c0-9226-33cf6c4bcdef
      responses:
        "200":
          description: The game.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogGame" }
              example:
                id: fc9cd9c2-aa68-42c0-9226-33cf6c4bcdef
                title: Elden Ring
                slug: elden-ring
                platforms:
                  - { id: 6, name: PC (Microsoft Windows), slug: win }
                  - { id: 48, name: PlayStation 4, slug: ps4--1 }
                  - { id: 49, name: Xbox One, slug: xboxone }
                  - { id: 167, name: PlayStation 5, slug: ps5 }
                  - { id: 169, name: Xbox Series X|S, slug: series-x-s }
                  - { id: 508, name: Nintendo Switch 2, slug: switch-2 }
                releaseDate: "2022-02-25"
                genres: [Role-playing (RPG), Adventure]
                coverImageUrl: https://images.igdb.com/igdb/image/upload/t_cover_big_2x/co4jni.jpg
                timeToBeatHours: 119.4
                sessionFit: low
                criticScore: 97
                abbreviation: ER
                colorKey: red
        "400":
          description: >
            The last path segment is neither a uuid nor `popular`. `/games` with
            no id gives this too, not a 404.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionError" }
              example: { error: "expected /games/<uuid> or /games/popular" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Well-formed uuid, no such game.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionError" }
              example: { error: game not found }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /roulette:
    get:
      tags: [library]
      operationId: rouletteFromBacklog
      summary: "Pick one game from the caller's backlog"
      description: |
        Deployed and verified 8 September 2026 (`npm run verify:roulette`).

        Picks from the caller's own `library_entries`, so it needs a real backlog
        to draw from — it is not a catalog endpoint. Entries with status `backlog`
        or `playing` are eligible; `beaten` and `dropped` are never returned.
        A fresh account has no rows, so this returns `null` until the user has
        confirmed at least one share. `/share-confirm` is what fills it; that is
        now live, and `npm run verify:share` asserts the whole chain — confirm a
        game, then roll, and get that game back.

        Two inputs, deliberately. `hours` is how long the user has tonight; `size`
        is how big a game they are in the mood for. Total time-to-beat and session
        length are different quantities on different scales, so `hours` reweights
        and never filters — filtering one on the other deals everybody the same
        three short indies forever.

        **It is a genuine roulette: the same request twice will usually give two
        different games.** Selection is weighted-random, and every eligible entry
        keeps a non-zero chance no matter what `hours` is. A short evening tilts
        the odds toward a game already `playing` and toward high `sessionFit`; from
        four hours upward the weights flatten and the pick is uniform. Do not cache
        the response or treat it as stable — re-request to re-roll.

        `null` is a real answer meaning the backlog is empty on that platform. It
        never means "the filters excluded everything".
      parameters:
        - name: platform
          in: query
          required: true
          schema: { type: integer }
          description: >
            Platform id, as in `PlatformRef.id` (167 = PS5, 130 = Switch, 6 = PC).
            Filters on where the game is playable, not on what the user tagged.
            Missing, empty or non-integer values are a 400 — earlier builds coerced
            a missing value to 0 and answered `null`, which was indistinguishable
            from an empty backlog.
          example: 167
        - name: size
          in: query
          required: false
          schema: { type: string, enum: [quick, medium, epic] }
          description: >
            Total length bucket — quick under 10h, medium 10-30h, epic over 30h.
            Omit for any size. Any other value is a 400.
        - name: hours
          in: query
          required: false
          schema: { type: number, default: 2 }
          description: >
            Hours free tonight. Shifts the odds; never excludes a game. Below four
            hours the pick tilts increasingly toward resuming a game already
            `playing` and toward high `sessionFit`; at four or more it is uniform
            over the eligible backlog. Unparseable, zero and negative values fall
            back to 2.
      responses:
        "200":
          description: >
            One game, or `null` when the backlog is empty on that platform. A
            different game on each request.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/CatalogGame" }
                  - { type: "null" }
              examples:
                rolled:
                  summary: A roll against a PS5 backlog
                  value:
                    id: 69b228a0-0452-4b69-a0a9-c9a0237da5d3
                    title: "The Witcher 3: Wild Hunt"
                    slug: the-witcher-3-wild-hunt
                    platforms:
                      - { id: 130, name: Nintendo Switch, slug: switch }
                      - { id: 6, name: PC (Microsoft Windows), slug: win }
                      - { id: 48, name: PlayStation 4, slug: ps4--1 }
                      - { id: 167, name: PlayStation 5, slug: ps5 }
                      - { id: 49, name: Xbox One, slug: xboxone }
                      - { id: 169, name: Xbox Series X|S, slug: series-x-s }
                    releaseDate: "2015-05-19"
                    genres: ["Role-playing (RPG)", "Adventure"]
                    coverImageUrl: https://images.igdb.com/igdb/image/upload/t_cover_big_2x/coaarl.jpg
                    timeToBeatHours: 70.8
                    sessionFit: low
                    criticScore: 92
                    abbreviation: W3W
                    colorKey: green
                empty:
                  summary: Nothing in the backlog on that platform
                  value: null
        "400":
          description: >
            `platform` was missing, empty or not an integer, or `size` was not
            quick, medium or epic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionError" }
              examples:
                missingPlatform: { value: { error: platform is required } }
                badPlatform: { value: { error: platform must be an integer platform id } }
                badSize: { value: { error: size must be quick, medium or epic } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /share-resolve:
    post:
      tags: [share]
      operationId: resolveShare
      summary: "Turn a shared TikTok/YouTube link into game candidates"
      description: |
        Deployed and verified 8 September 2026 (`npm run verify:share`). The path
        is `share-resolve`, matching the function directory — not `/share/resolve`.

        A `share_intake` row is written the instant the share arrives, before any
        matching is attempted. If resolution then fails, the link is still saved
        and the user can come back to it. Nothing a user shares is ever silently
        dropped — which is why this returns 200 with an empty `candidates` list
        rather than an error when it cannot work out the game.

        oEmbed quality varies wildly by provider. YouTube gives a clean title;
        TikTok gives the whole caption, hashtags and emoji included, so the text
        is cleaned into several candidate terms and each is tried in turn.

        **Both oEmbed endpoints work from the deployed function.** A cross-check
        report had claimed they throttle or 403 datacenter IPs, which would have
        forced a fallback to scraping OpenGraph tags. Probed from the edge runtime
        on 8 Sep: YouTube and TikTok both answered 200, with and without a browser
        User-Agent, caption and hashtags intact. There is no OpenGraph fallback and
        none is needed.

        This endpoint never writes to the user's library. `confident: true` means
        "show this one large", not "add it".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  description: The shared link, exactly as received from the share sheet.
              example: { url: "https://www.youtube.com/watch?v=E3Huy2cdih0" }
      responses:
        "200":
          description: >
            Resolution finished. `candidates` may be empty; the intake row exists
            either way.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareResolution" }
        "400":
          description: Body was not JSON, or `url` was missing or not a string.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionError" }
              example: { error: "expected JSON body {url}" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500":
          description: The intake row could not be written. Nothing was saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionError" }

  /share-confirm:
    post:
      tags: [share]
      operationId: confirmShare
      summary: "Commit the user's pick to their library"
      description: |
        Deployed and verified 8 September 2026 (`npm run verify:share`).

        The user has tapped a game on the confirm screen. This is the only path
        that writes a shared game into a library, and `source_url` travels with
        it — that field is the differentiator, and what later makes the finish
        card interesting: "found on TikTok in March, beaten in September" beats a
        bare rating.

        **Idempotent per (user, game), and idempotent means "leave it alone".**
        A repeat confirm returns the row that is already there, with the user's
        `status`, `rating` and `notes` untouched — sharing a game you have already
        beaten does not knock it back to `backlog`. Provenance is only ever filled
        in, never over: a game added by hand and later shared gains the link it
        came from, one that already carries a `source_url` keeps its first.
        `source_kind` is derived from the intake's provider, not sent by the client.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intakeId, gameId]
              properties:
                intakeId:
                  type: string
                  format: uuid
                  description: From the `share-resolve` response.
                gameId:
                  type: string
                  format: uuid
                  description: The `CatalogGame.id` the user picked.
      responses:
        "200":
          description: The library row, as stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryEntry" }
        "400":
          description: Body was not JSON, or a field was missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionError" }
              example: { error: intakeId and gameId are required }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >
            No such intake for this user. RLS already scopes the lookup to the
            caller, so another user's intake id is a 404, not a 403.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionError" }
              example: { error: intake not found }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /steam-link-start:
    post:
      tags: [account linking]
      operationId: startSteamLink
      summary: "Begin connecting a Steam account"
      description: |
        Deployed and verified 14 September 2026 (`npm run verify:linking`).

        Step 1 of three. Open `redirectUrl` in a browser; the user signs in on
        Steam's own page; Steam redirects to `/steam-link-callback`, which 302s
        back into the app; the app then calls `/steam-link-finish` with `nonce`.

        **This is a connection, never a sign-in.** The request is authenticated, so
        a Prysm account already exists. That is what keeps App Store guideline 4.8
        out of scope — the moment "Sign in with Steam" becomes a way to *create* an
        account, Sign in with Apple is pulled in for the whole app.

        Valve requires one of their supplied "Sign in through Steam" button images
        on the button that leads here.

        The `nonce` is 32 random bytes, single-use, and expires in ten minutes.
      responses:
        "200":
          description: Where to send the user, and the nonce to come back with.
          content:
            application/json:
              schema:
                type: object
                required: [redirectUrl, nonce]
                properties:
                  redirectUrl:
                    type: string
                    format: uri
                    description: >
                      An OpenID 2.0 `checkid_setup` URL on
                      `steamcommunity.com/openid/login`.
                  nonce:
                    type: string
                    description: Pass to `/steam-link-finish` after the redirect returns.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /steam-link-callback:
    get:
      tags: [account linking]
      operationId: steamLinkCallback
      summary: "Where Steam sends the user back (not called by the app)"
      description: |
        Deployed and verified 14 September 2026.

        **The app never calls this.** Steam's servers redirect the user's browser
        here after sign-in. It is listed so nobody is surprised by the one endpoint
        in this API that takes no `Authorization` header — it is deployed with
        `--no-verify-jwt`, because a redirect from Steam cannot carry a JWT and
        there is no way to make it.

        It is safe because it trusts nothing in the request. Every `openid.*`
        parameter is attacker-controlled until Steam confirms the signature, so the
        handler performs an OpenID `check_authentication` round trip back to Steam
        and accepts the SteamID64 only if Steam answers `is_valid:true`. Reading the
        id straight out of `openid.claimed_id` would be account takeover by
        impersonation. The single-use nonce, minted by an authenticated
        `/steam-link-start` call, is what names the user.

        It creates no connection. It records the verified id against the nonce and
        redirects; `/steam-link-finish` writes the connection under the user's own
        JWT.
      security: []
      parameters:
        - name: nonce
          in: query
          required: true
          schema: { type: string }
        - name: "openid.*"
          in: query
          required: true
          schema: { type: string }
          description: The OpenID 2.0 response parameters, passed through verbatim by Steam.
      responses:
        "302":
          description: |
            Always a redirect into the app, never a rendered page.
            `Location` is `APP_LINK_RETURN_URL` (`prysm://link/steam`) plus
            `?status=ok|failed|expired&nonce=...`. Only `ok` should lead the app to
            call `/steam-link-finish`.
          headers:
            Location:
              schema: { type: string }
              example: "prysm://link/steam?status=ok&nonce=DVOLAh9aF9C2LyWKOdGSnoVlFN4CtUC8QksYfimLm28"
        "400":
          description: No nonce in the query string.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionError" }
              example: { error: missing nonce }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }

  /steam-link-finish:
    post:
      tags: [account linking]
      operationId: finishSteamLink
      summary: "Turn a verified nonce into the connection"
      description: |
        Deployed and verified 14 September 2026 (`npm run verify:linking`).

        Step 3 of three, called when the app is back in the foreground with the
        `status=ok` redirect. The write happens under the caller's own JWT, so RLS —
        not this code — is what guarantees the connection lands on the right
        account: a nonce belonging to someone else is simply not visible, and the
        lookup 404s.

        Display name and avatar are fetched from Steam as a convenience and are not
        fatal; a connection Steam has already verified is not refused over a missing
        avatar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce]
              properties:
                nonce:
                  type: string
                  description: The nonce from `/steam-link-start`.
      responses:
        "200":
          description: The stored connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformAccount" }
        "400":
          description: Body was not JSON, or `nonce` was missing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionError" }
              example: { error: nonce is required }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such link request for this user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionError" }
              example: { error: link request not found }
        "409":
          description: >
            The nonce was already used, or Steam never confirmed the sign-in, or
            that Steam account is already linked to a different Prysm account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionError" }
              example: { error: steam did not confirm this sign-in }
        "410":
          description: The link request expired. Ten minutes is the window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionError" }
              example: { error: link request expired }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/ServerError" }

  /steam-import:
    post:
      tags: [account linking]
      operationId: importSteamLibrary
      summary: "Pull the linked Steam library into the user's shelf"
      description: |
        Deployed and verified 14 September 2026 (`npm run verify:linking`), including
        a real 4,652-game library end to end in **3.4 seconds**: one Steam call, one
        resolve, one write, and **zero IGDB round trips** — the whole point of the
        `game_external_ids` map.

        **`total` and `matched` always differ, and how much depends on the account.**
        Measured against that real library: **38.6%** of everything owned resolved,
        but **83.1%** of everything ever played and **85.0%** of the top 20 by
        playtime. Owned and played are very different sets on Steam — bundles and
        giveaways pile up apps nobody opens — and every miss is in the never-opened
        part. Some of the gap is also correct behaviour: Blender, Wallpaper Engine
        and Source Filmmaker are not games.

        So show both numbers, and lead with playtime: the top of a playtime-sorted
        list is ~85% complete at any library size. "Added 412 of your 468 Steam
        games" is honest; "Done" invites the user to go hunting.

        **The paywall goes after this response, never before it.** Imported rows
        count against the 50-game free tier and this endpoint deliberately does not
        enforce that.

        Re-running is safe and is the sync path. It fills blanks and never
        relitigates the shelf: a status, rating or note the user set is never
        overwritten. Editions that collapse onto one catalog game (Skyrim + Skyrim
        Special Edition) are deduped before writing and their playtime summed —
        1,797 appids became 1,656 rows in the verified run.
      responses:
        "200":
          description: What the import found and what it did.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: |
            Either no Steam account is linked (`{"error": "no steam account linked"}`),
            or — far more often — the user's **Game details** privacy is not Public.

            That second case is the predicted top support complaint and Steam makes
            it silent: a private profile answers HTTP 200 with `{"response":{}}`, no
            `games` array and no `game_count`, which is indistinguishable from a
            successful import of zero games. It is detected and reported with a
            distinct body carrying `fixUrl` — render that as a button, not text.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FunctionError"
                  - type: object
                    required: [error, message, fixUrl]
                    properties:
                      error: { type: string, enum: [steam_profile_private] }
                      message: { type: string }
                      fixUrl: { type: string, format: uri }
              example:
                error: steam_profile_private
                message: >
                  Your Steam game details are private, so Steam returns an empty
                  library. Set Game details to Public and try again.
                fixUrl: "https://steamcommunity.com/my/edit/settings"
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "502":
          description: Steam's API was unreachable or rejected our key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FunctionError" }
        "500": { $ref: "#/components/responses/ServerError" }

components:
  securitySchemes:
    userToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A Supabase **user** access token: `Authorization: Bearer <session.access_token>`.

        `supabase.functions.invoke()` attaches it for you. With plain `fetch` you
        must set it yourself. The `apikey: <anon key>` header is optional when a
        user token is present (verified: the call succeeds without it) and
        harmless to send.

        The anon key is not a substitute for a session. Sending it as the bearer
        passes the gateway's signature check and then fails inside the function
        with `401 {"error":"invalid or expired token"}`, because it carries no user.

  responses:
    Unauthorized:
      description: |
        No session, or a bad one. **Two shapes, from two layers:**

        * Missing or malformed `Authorization` — the Supabase edge gateway rejects
          it before the function runs: `{"code":"UNAUTHORIZED_NO_AUTH_HEADER",
          "message":"Missing authorization header"}`, or
          `UNAUTHORIZED_INVALID_JWT_FORMAT` / `"Invalid JWT"`.
        * A well-formed token that resolves to no user (an expired session, or the
          anon key used as a bearer) — the function answers
          `{"error":"invalid or expired token"}`.
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: "#/components/schemas/GatewayError" }
              - { $ref: "#/components/schemas/FunctionError" }
          examples:
            noHeader:
              summary: No Authorization header (gateway)
              value: { code: UNAUTHORIZED_NO_AUTH_HEADER, message: Missing authorization header }
            malformed:
              summary: Not a JWT (gateway)
              value: { code: UNAUTHORIZED_INVALID_JWT_FORMAT, message: Invalid JWT }
            noUser:
              summary: Valid signature, no user — e.g. the anon key as bearer (function)
              value: { error: invalid or expired token }
    MethodNotAllowed:
      description: Wrong HTTP verb for this endpoint.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FunctionError" }
          example: { error: method not allowed }
    ServerError:
      description: A database or Postgres function error, passed through.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FunctionError" }

  schemas:
    GatewayError:
      type: object
      description: Raised by the Supabase edge gateway, before the function runs.
      required: [code, message]
      properties:
        code: { type: string, example: UNAUTHORIZED_NO_AUTH_HEADER }
        message: { type: string, example: Missing authorization header }
    FunctionError:
      type: object
      description: Raised by the function itself. Always exactly this one key.
      required: [error]
      properties:
        error: { type: string }

    PlatformRef:
      type: object
      description: >
        A platform the game is available on. IGDB's own ids and slugs, stable
        across the catalog.
      required: [id, name, slug]
      properties:
        id: { type: integer, example: 167 }
        name: { type: string, example: PlayStation 5 }
        slug: { type: string, example: ps5 }

    CatalogGame:
      type: object
      description: |
        The one shape every catalog endpoint returns. Search results and the
        detail endpoint are the same object — there is no thin/fat variant to
        branch on, and no second fetch needed to render a detail screen from a
        search result.

        **Optional fields are genuinely often absent.** Only about 5% of games
        carry a time to beat, so treat `timeToBeatHours` as usually missing.
      required: [id, title, platforms, genres, abbreviation, colorKey]
      properties:
        id:
          type: string
          format: uuid
          description: Ours, not IGDB's. The key for everything; `library_entries.game_id` points at it.
        title: { type: string }
        slug:
          type: string
          description: >
            IGDB's slug. Stable and human-readable, so share links can use it
            instead of the uuid. Present on effectively every row, but typed
            optional because the column is nullable.
        platforms:
          type: array
          items: { $ref: "#/components/schemas/PlatformRef" }
          description: >
            Availability — what the game runs on, not what the user owns. Can be
            empty. **Order is not part of the contract and differs by endpoint:**
            /search returns them sorted by name, /games/{id} by platform id. Sort
            client-side if the order matters visually.
        releaseDate:
          type: string
          format: date
          description: >
            `YYYY-MM-DD`. Absent for plenty of games, and a date here does not mean
            unreleased — past and future dates both come through. Compare against
            today before treating one as an upcoming release.
        genres:
          type: array
          items: { type: string }
          description: IGDB's labels, verbatim, e.g. `Role-playing (RPG)`. Can be empty.
        coverImageUrl:
          type: string
          format: uri
          description: >
            IGDB box art at the `t_cover_big_2x` size, 528x748. Real cover art
            fails to load more often than you would expect, which is what
            `abbreviation` and `colorKey` are for.
        timeToBeatHours:
          type: number
          description: >
            IGDB's "normally" completion estimate, in hours. Total playtime, not
            session length — do not filter a "1 hour tonight" input on it.
            Present on roughly 5% of the catalog.
        sessionFit:
          type: string
          enum: [high, medium, low]
          description: >
            Does this work in a short evening? Derived from genres, game modes and
            keywords — deliberately not from time to beat. Balatro's total playtime
            is effectively unbounded and it is the best 45-minute game there is.
            A first-cut heuristic, to be revisited once the roulette has real use.
        criticScore:
          type: integer
          minimum: 0
          maximum: 100
          description: >
            IGDB's aggregate of external critic scores. **Not Metacritic** — do not
            label it as such in the UI.
        abbreviation:
          type: string
          minLength: 2
          maxLength: 3
          description: >
            Two or three letters for the coloured swatch shown when cover art
            fails. Derived server-side so the fallback is identical on every
            device. Up to three initials, so *Return of the Obra Dinn* is `ROD`.
          example: ER
        colorKey:
          type: string
          enum: [teal, orange, purple, pink, gold, navy, red, green, blue, slate]
          description: >
            The swatch colour, stable per title across sessions and devices. These
            keys are the app's own `CoverColorKey` union, resolved in
            `src/shared/theme/theme.ts`. `GameCover.tsx` silently falls back to
            `slate` for an unknown key, so a rename on either side goes unnoticed
            — if a colour changes in theme.ts, say so and this list changes with it.
          example: red

    CatalogGameWithFriendCount:
      description: >
        A `CatalogGame` with one field added. Every other field is byte-identical to
        what `/search`, `/games/{id}` and `/games/popular` return, so the app renders
        these in the same component with no new type.
      allOf:
        - $ref: "#/components/schemas/CatalogGame"
        - type: object
          required: [friendCount]
          properties:
            friendCount:
              type: integer
              minimum: 3
              description: >
                How many of the people you follow have this game with status
                `playing` or `beaten`. Never below 3 — a game below that floor is
                omitted from the list entirely rather than returned with a small
                count, because at one or two the aggregate stops being anonymous.
                It counts distinct people, not library rows.
              example: 3

    ShareResolution:
      type: object
      required: [intakeId, provider, extractedText, confident, candidates]
      properties:
        intakeId:
          type: string
          format: uuid
          description: Pass this back to /share-confirm. The row exists even when nothing matched.
        provider:
          type: string
          enum: [tiktok, youtube, other]
          nullable: true
        extractedText:
          type: string
          nullable: true
          description: >
            The oEmbed title the match was attempted from. Null if oEmbed failed
            or the provider gave nothing. Useful to show as "we read this from
            your link".
        confident:
          type: boolean
          description: |
            Show the top candidate large. It is still a suggestion — the confirm
            step is never skipped, because silently adding the wrong game to
            someone's backlog kills trust in the one feature that makes this app
            different.

            The bar differs by provider, deliberately. A **YouTube** title is a
            real attempt at the game's name, so the trigram score decides: 0.55 or
            better. A **TikTok** hashtag is not an attempt at anything — it is a
            word someone tagged — so proximity is not evidence there, and the bar
            is that the term IS one of the game's names, up to spacing
            (`#eldenring` names Elden Ring; `#aesthetic` does not name Aestheta,
            even at 0.583 similarity). A near-miss stays in `candidates` and can
            still be tapped; only the assertion is withdrawn.
        candidates:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/CatalogGame" }
          description: >
            Best first, scoring 0.30 or better. Empty means unmatched — show the
            search box, and the link is still saved. DLC, expansions, bundles and
            special editions are filtered out at ingest, so these are genuinely
            different games rather than five versions of one.

    LibraryEntry:
      type: object
      description: A row of `library_entries`, returned by /share-confirm exactly as stored (snake_case).
      required: [id, user_id, game_id, status, notes, added_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        game_id: { type: string, format: uuid }
        status:
          type: string
          enum: [playing, backlog, beaten, dropped]
          description: Always `backlog` when created by /share-confirm.
        rating: { type: integer, minimum: 1, maximum: 10, nullable: true }
        notes: { type: string, default: "" }
        hours_played: { type: number, nullable: true }
        platform_id:
          type: integer
          nullable: true
          description: What they play it on — not availability.
        source_url:
          type: string
          nullable: true
          description: The TikTok or YouTube link the game came from.
        source_kind:
          type: string
          enum: [tiktok, youtube, search, manual, steam, xbox, psn]
          nullable: true
          description: >
            Where the row came from. For /share-confirm it is derived from the
            intake's provider and anything not tiktok/youtube becomes `manual`.
            **Widened 14 Sep 2026** with `steam`, `xbox` and `psn` for imported rows
            — if a client types this as a closed union, imported rows fall through.
            `psn` is included although PlayStation is not built, so tolerating it
            now costs nothing later.
        imported_uid:
          type: string
          nullable: true
          description: >
            The store id this row was imported from (a Steam appid, for example).
            Added 14 Sep 2026. Clients can ignore it; it exists so a disconnect
            knows exactly what an import created.
        added_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }

    PlatformAccount:
      type: object
      description: >
        A row of `platform_accounts` — a connected platform, owner-only under RLS.
        **Nothing secret is stored here**, and that is deliberate rather than
        incidental: Steam's OpenID returns an identity and no token at all.
      required: [user_id, platform, external_id, linked_at]
      properties:
        user_id: { type: string, format: uuid }
        platform:
          type: string
          enum: [steam, xbox]
          description: >
            `psn` is absent because PlayStation is not built. It goes in when it
            ships, so this list never claims a connection that does not exist.
        external_id:
          type: string
          description: SteamID64 for Steam, XUID for Xbox. A public identifier, not a credential.
        display_name: { type: string, nullable: true }
        avatar_url: { type: string, nullable: true }
        linked_at: { type: string, format: date-time }
        last_import_at: { type: string, format: date-time, nullable: true }
        last_import_total:
          type: integer
          nullable: true
          description: Apps the last import saw.
        last_import_matched:
          type: integer
          nullable: true
          description: >
            How many reached our catalog. Deliberately stored alongside the total so
            the app can say "412 of 468" without re-running anything.

    ImportResult:
      type: object
      description: What /steam-import found and what it wrote.
      required: [total, matched, inserted, updated, viaParent, unmatched]
      properties:
        total:
          type: integer
          description: Apps the platform returned. 4,652 in the verified run.
        matched:
          type: integer
          description: >
            How many resolved to a catalog game. 1,797 in the verified run — see the
            endpoint description for why this is much lower than `total` on large
            accounts and why that is mostly correct.
        inserted:
          type: integer
          description: >
            Rows added. Lower than `matched` because editions collapse onto one game:
            1,656 rows from 1,797 appids in the verified run.
        updated:
          type: integer
          description: >
            Rows already present and left alone apart from provenance and, on rows
            the import owns, playtime. A status, rating or note the user set is never
            overwritten.
        viaParent:
          type: integer
          description: >
            How many resolved only by following IGDB's `parent_game` — i.e. the user
            owns an edition or remaster and we gave them the base game.
        unmatched:
          type: array
          items: { type: string }
          description: >
            Store ids that reached nothing, **capped at 50**. It is a sample for
            debugging, not a complete list; a large library can miss thousands.
          maxItems: 50
