# Minimal config. `supabase link --project-ref <ref>` fills in the rest, and
# `supabase init` will offer to expand this if you want the full local stack.
project_id = "shelf-backend"

[db]
# The remote project runs Postgres 17 (17.6.1.166, engine 17) — confirmed via the
# Management API on 5 Sep 2026. This said 15, which would have started the local
# stack on a different major version than production and let `db reset` pass on
# SQL that production rejects. Keep the two in step.
major_version = 17

[functions.search]
verify_jwt = true
[functions.games]
verify_jwt = true
[functions.share-resolve]
verify_jwt = true
[functions.share-confirm]
verify_jwt = true
[functions.roulette]
verify_jwt = true
[functions.steam-link-start]
verify_jwt = true
# The two unauthenticated endpoints in this backend, and they have to be: Steam and
# xbl.io redirect the user's browser here after sign-in, with no Authorization
# header and no way to add one. Both are safe because they trust nothing in the
# request — Steam's identity is confirmed by an OpenID check_authentication round
# trip, Xbox's by claimXboxCode()'s round trip to xbl.io/app/claim, and in both
# cases a single-use nonce in the query string is what names the user (Xbox's is
# UNVERIFIED whether it survives the redirect at all — see _shared/xbox.ts).
# Deploy both with `--no-verify-jwt`; these lines only cover `supabase functions
# serve`.
[functions.steam-link-callback]
verify_jwt = false
[functions.steam-link-finish]
verify_jwt = true
[functions.steam-import]
verify_jwt = true
[functions.xbox-link-start]
verify_jwt = true
[functions.xbox-link-callback]
verify_jwt = false
[functions.xbox-link-finish]
verify_jwt = true
[functions.xbox-import]
verify_jwt = true
