# Minimal config. `supabase link --project-ref <ref>` fills in the rest, and
# `supabase init` will offer to expand this if you want the full local stack.
project_id = "shelf-backend"

[db]
# The remote project runs Postgres 17 (17.6.1.166, engine 17) — confirmed via the
# Management API on 5 Sep 2026. This said 15, which would have started the local
# stack on a different major version than production and let `db reset` pass on
# SQL that production rejects. Keep the two in step.
major_version = 17

[functions.search]
verify_jwt = true
[functions.games]
verify_jwt = true
[functions.share-resolve]
verify_jwt = true
[functions.share-confirm]
verify_jwt = true
[functions.roulette]
verify_jwt = true
[functions.steam-link-start]
verify_jwt = true
# The ONLY unauthenticated endpoint in this backend, and it has to be: Steam
# redirects the user's browser here after sign-in, with no Authorization header and
# no way to add one. It is safe because it trusts nothing in the request — the
# identity is confirmed by an OpenID check_authentication round trip to Steam, and
# the single-use nonce in the query string is what names the user. Deploy it with
# `--no-verify-jwt`; this line only covers `supabase functions serve`.
[functions.steam-link-callback]
verify_jwt = false
[functions.steam-link-finish]
verify_jwt = true
[functions.steam-import]
verify_jwt = true
